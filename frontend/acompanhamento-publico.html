<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acompanhamento do seu projeto</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E8672B; --dark:#2A1B10; --bg:#F5F1EA; --surface:#fff;
    --border:#E4DCCB; --text-faint:#8A7A6A; --green:#2E9B5C;
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Barlow',sans-serif; }
  body{ background:var(--bg); color:var(--dark); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap{ width:100%; max-width:480px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; box-shadow:0 8px 30px rgba(42,27,16,.08); }
  .logo{ font-size:13px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--orange); margin-bottom:18px; }
  h1{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .sub{ font-size:13px; color:var(--text-faint); margin-bottom:24px; }
  .progress-outer{ height:8px; background:#EFE8DA; border-radius:99px; overflow:hidden; margin-bottom:6px; }
  .progress-inner{ height:100%; background:linear-gradient(90deg, var(--orange), #F3934F); transition:width .4s; }
  .progress-label{ font-size:12px; color:var(--text-faint); margin-bottom:22px; text-align:right; }
  .etapas{ display:flex; flex-direction:column; gap:0; }
  .etapa{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; position:relative; }
  .etapa:not(:last-child)::before{ content:''; position:absolute; left:11px; top:30px; bottom:-4px; width:2px; background:var(--border); }
  .etapa .bola{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; z-index:1; }
  .etapa.concluido .bola{ background:var(--green); color:#fff; }
  .etapa.andamento .bola{ background:var(--orange); color:#fff; }
  .etapa.pendente .bola, .etapa.bloqueado .bola{ background:#EFE8DA; color:var(--text-faint); }
  .etapa .nome{ font-size:14px; font-weight:600; padding-top:2px; }
  .etapa.pendente .nome, .etapa.bloqueado .nome{ color:var(--text-faint); }
  .etapa .tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--orange); margin-top:2px; }
  .status-final{ text-align:center; padding:30px 10px; }
  .status-final .emoji{ font-size:38px; margin-bottom:10px; }
  .erro{ text-align:center; padding:20px 10px; color:var(--text-faint); font-size:14px; }
  .loading{ text-align:center; padding:30px 10px; color:var(--text-faint); font-size:13px; }
  footer{ text-align:center; margin-top:16px; font-size:11px; color:var(--text-faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="cardConteudo">
      <div class="loading">Carregando...</div>
    </div>
    <footer>Acompanhamento gerado automaticamente — dúvidas, fale com quem está cuidando do seu projeto.</footer>
  </div>

<script>
(async function(){
  const cardEl = document.getElementById('cardConteudo');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){
    cardEl.innerHTML = `<div class="erro">Link inválido — falta o código de acompanhamento na URL.</div>`;
    return;
  }

  try{
    const resp = await fetch(`/api/acompanhamento-publico?token=${encodeURIComponent(token)}`);
    const data = await resp.json();
    if(!resp.ok || data.error){
      cardEl.innerHTML = `<div class="erro">${(data && data.error) || 'Link inválido ou expirado.'}</div>`;
      return;
    }

    const etapas = data.etapas || [];
    const total = etapas.length;
    const feitas = etapas.filter(e => e.status === 'concluido').length;
    const pct = total ? Math.round((feitas / total) * 100) : 0;

    if(data.status_geral === 'concluido'){
      cardEl.innerHTML = `
        <div class="logo">Acompanhamento do projeto</div>
        <div class="status-final">
          <div class="emoji">🎉</div>
          <h1>Projeto concluído!</h1>
          <div class="sub">Todas as etapas foram finalizadas.</div>
        </div>
      `;
      return;
    }

    const iconePorStatus = { concluido: '✓', andamento: '', pendente: '', bloqueado: '!' };

    cardEl.innerHTML = `
      <div class="logo">Acompanhamento do projeto</div>
      <h1>Como está o seu projeto</h1>
      <div class="sub">Acompanhe abaixo cada etapa em tempo real.</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
      <div class="progress-label">${feitas} de ${total} etapas concluídas</div>
      <div class="etapas">
        ${etapas.map(e => `
          <div class="etapa ${e.status}">
            <div class="bola">${iconePorStatus[e.status] || ''}</div>
            <div>
              <div class="nome">${e.nome_etapa}</div>
              ${e.status === 'andamento' ? '<div class="tag">Em andamento</div>' : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch(e){
    cardEl.innerHTML = `<div class="erro">Não foi possível carregar o acompanhamento agora. Tente novamente em instantes.</div>`;
  }
})();
</script>
</body>
</html>
