<div class="page-container">
    <div class="page-header">
        <h1>Baterias</h1>
        <p>Gerencie as baterias do sistema</p>
    </div>

    <div class="card compact">
        <div class="card-title">Nova Bateria</div>
        <div class="form-grid-compact">
            <div class="floating-group">
                <input type="text" id="batNome" placeholder=" ">
                <label>Nome/Modelo</label>
            </div>
            <div class="floating-group">
                <select id="batTipo">
                    <option value="CHUMBO">Chumbo Ácido</option>
                    <option value="LITIO">Lítio</option>
                    <option value="ESTACIONARIA">Estacionária</option>
                </select>
                <label>Tipo da Bateria</label>
            </div>
            <div class="floating-group">
                <input type="number" id="batGarantia" value="5" placeholder=" ">
                <label>Garantia (anos)</label>
            </div>
            <div class="floating-group">
                <input type="number" id="batCapacidade" placeholder=" ">
                <label>Capacidade (Ah)</label>
            </div>
            <div class="floating-group">
                <input type="number" id="batTensao" placeholder=" ">
                <label>Tensão (V)</label>
            </div>
            <div class="floating-group">
                <input type="text" id="batInmetro" placeholder=" ">
                <label>INMETRO</label>
            </div>
            <div class="floating-group full-width">
                <input type="text" id="batOutros" placeholder=" ">
                <label>Outros (Informações adicionais)</label>
            </div>
            
            <!-- ÁREA DE UPLOAD DE IMAGEM COM INDICADOR VISUAL -->
            <div class="floating-group image-upload full-width">
                <label>Imagem da Bateria</label>
                <input type="file" id="batImagem" accept="image/*" style="display: none;">
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button type="button" class="btn btn-small" id="btnSelecionarImagemBateria" onclick="abrirSelecaoImagemBateria()">
                        <i data-lucide="image"></i> Selecionar Imagem
                    </button>
                    <div id="statusUploadBateria" style="display: none; font-size: 12px; padding: 4px 8px; border-radius: 4px;">
                        <!-- Status será preenchido aqui -->
                    </div>
                </div>
                <div id="previewImagemBateria" class="image-preview" style="display: none; margin-top: 10px;">
                    <img id="previewImgBateria" style="max-width: 100px; max-height: 100px; object-fit: contain;">
                    <button type="button" class="btn-icon" onclick="removerImagemBateria()">✗</button>
                </div>
                <div id="progressoImagemBateria" style="display: none; margin-top: 8px;">
                    <div style="background: #f0f0f0; border-radius: 4px; overflow: hidden;">
                        <div id="barraProgressoBateria" style="width: 0%; height: 4px; background: #2ecc71; transition: width 0.3s;"></div>
                    </div>
                    <span id="statusProgressoBateria" style="font-size: 11px; color: #666;"></span>
                </div>
                <small>Imagem será redimensionada para 500x500px, com fundo removido automaticamente</small>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" id="btnCadastrarBateria" onclick="cadastrarBateria()">Cadastrar</button>
        </div>
    </div>

    <div class="card compact">
        <div class="card-title">
            <span>Filtros</span>
        </div>
        <div class="config-grid" style="grid-template-columns: repeat(2, 1fr);">
            <div class="floating-group">
                <select id="filtroTipoBateria" onchange="filtrarBaterias()">
                    <option value="">Todos os Tipos</option>
                    <option value="CHUMBO">Chumbo Ácido</option>
                    <option value="LITIO">Lítio</option>
                    <option value="ESTACIONARIA">Estacionária</option>
                </select>
                <label>Tipo</label>
            </div>
            <div class="floating-group">
                <select id="filtroCapacidadeBateria" onchange="filtrarBaterias()">
                    <option value="">Todas as Capacidades</option>
                    <option value="0-50">Até 50Ah</option>
                    <option value="51-100">51Ah - 100Ah</option>
                    <option value="101-200">101Ah - 200Ah</option>
                    <option value="201+">Acima de 200Ah</option>
                </select>
                <label>Capacidade</label>
            </div>
        </div>
    </div>

    <div class="card compact">
        <div class="card-title">Lista de Baterias</div>
        <div id="listaBateriasContent" class="lista-itens-container"></div>
    </div>
</div>
