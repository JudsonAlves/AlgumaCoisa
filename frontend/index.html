<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocha Engenharia — Energia Solar</title>
<meta name="description" content="Fale com a Rocha Engenharia sobre o seu projeto de energia solar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1720;
    --bg-2: #131e29;
    --line: #223140;
    --cell: #17232e;
    --text: #eef2f6;
    --muted: #8b98a5;
    --amber: #f2b705;
    --amber-2: #ffd24d;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  #grid{
    position:fixed; inset:0;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    grid-auto-rows: 64px;
    z-index:0;
    opacity:.55;
  }
  #grid div{
    border:1px solid var(--line);
    background:var(--cell);
  }
  @media (prefers-reduced-motion: no-preference){
    #grid div.lit{ animation: pulse 2.6s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%,100%{ background:var(--cell); }
    50%{ background:#1d2c39; }
  }

  main{
    position:relative;
    z-index:1;
    max-width:560px;
    width:100%;
    padding:48px 32px;
    text-align:center;
  }

  .brand{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:40px;
  }
  .brand img{ height:30px; width:auto; }
  .brand span{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 18px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5.4vw, 44px);
    line-height:1.12;
    margin:0 0 16px;
    letter-spacing:-.01em;
  }
  p.lead{
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
    margin:0 0 44px;
  }

  .switch-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  #switchBtn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--bg-2);
    border-radius:100px;
    padding:8px;
    width:172px;
    height:76px;
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    transition:border-color .25s ease, background .25s ease;
  }
  #switchBtn:hover{ border-color:#33465a; }
  #switchBtn .knob{
    width:60px; height:60px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--amber-2), var(--amber));
    display:flex; align-items:center; justify-content:center;
    transform:translateX(0);
    transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .38s ease;
    box-shadow: 0 0 0 rgba(242,183,5,0);
  }
  #switchBtn .knob svg{ width:26px; height:26px; stroke:#1a1206; }
  #switchBtn.on .knob{
    transform:translateX(96px);
    box-shadow: 0 0 28px rgba(242,183,5,.55);
  }
  #switchBtn .track-label{
    position:absolute;
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--muted);
    top:50%; transform:translateY(-50%);
  }
  #switchBtn .lbl-off{ left:20px; }
  #switchBtn .lbl-on{ right:18px; color:var(--bg); opacity:0; transition:opacity .25s ease; }
  #switchBtn.on .lbl-on{ opacity:1; color:#3a2c05; }
  #switchBtn.on .lbl-off{ opacity:0; }

  .switch-caption{ font-size:13px; color:var(--muted); }

  footer{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
  }
  footer a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px; }
  footer a:hover{ color:var(--text); border-color:var(--muted); }

  .unavailable{
    font-size:13px;
    color:var(--muted);
    max-width:320px;
    margin:0 auto;
  }

  #switchBtn:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
</style>
</head>
<body>

<div id="grid" aria-hidden="true"></div>

<main>
  <div class="brand">
    <img src="assets/images/logo-rocha.png" alt="" onerror="this.style.display='none'">
    <span id="empresaNome">Rocha Engenharia</span>
  </div>

  <p class="eyebrow">Energia solar</p>
  <h1>Sua energia<br>começa com uma conversa.</h1>
  <p class="lead">Ligue o interruptor para falar direto com a nossa equipe no WhatsApp.</p>

  <div class="switch-wrap" id="switchArea">
    <button id="switchBtn" aria-label="Abrir conversa no WhatsApp">
      <span class="track-label lbl-off">DESLIGADO</span>
      <span class="track-label lbl-on">LIGADO</span>
      <span class="knob">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
      </span>
    </button>
    <p class="switch-caption" id="switchCaption">Toque para ligar</p>
  </div>

  <footer id="footerInfo"></footer>
</main>

<script>
(function(){
  const grid = document.getElementById('grid');
  const cols = Math.ceil(window.innerWidth / 64);
  const rows = Math.ceil(window.innerHeight / 64);
  const total = cols * rows;
  const frag = document.createDocumentFragment();
  for(let i = 0; i < total; i++){
    const d = document.createElement('div');
    if((i % cols + Math.floor(i / cols)) % 7 === 0){
      d.classList.add('lit');
      d.style.animationDelay = ((i % 13) * 0.18) + 's';
    }
    frag.appendChild(d);
  }
  grid.appendChild(frag);

  let numero = '', mensagem = 'Olá! Gostaria de falar sobre energia solar.';

  async function carregarConfig(){
    try{
      const r = await fetch('/api/proposta-config');
      if(!r.ok) throw new Error('offline');
      const cfg = await r.json();
      if(cfg && typeof cfg === 'object'){
        if(cfg.empresa_nome) document.getElementById('empresaNome').textContent = cfg.empresa_nome;
        if(cfg.whatsapp_numero) numero = String(cfg.whatsapp_numero).replace(/\D/g, '');
        if(cfg.whatsapp_mensagem) mensagem = cfg.whatsapp_mensagem;

        const bits = [];
        if(cfg.rodape_endereco) bits.push(cfg.rodape_endereco);
        if(cfg.rodape_site) bits.push(`<a href="https://${cfg.rodape_site.replace(/^https?:\/\//,'')}" target="_blank" rel="noopener noreferrer">${cfg.rodape_site}</a>`);
        document.getElementById('footerInfo').innerHTML = bits.join(' · ');
      }
    }catch(e){ /* silencioso — o botão cai no estado indisponível abaixo */ }

    if(!numero){
      document.getElementById('switchArea').innerHTML =
        '<p class="unavailable">Nosso WhatsApp está sendo configurado. Volte em instantes ou tente novamente mais tarde.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    carregarConfig().then(() => {
      const btn = document.getElementById('switchBtn');
      if(!btn) return;
      btn.addEventListener('click', () => {
        if(!numero || btn.classList.contains('on')) return;
        btn.classList.add('on');
        document.getElementById('switchCaption').textContent = 'Abrindo o WhatsApp…';
        const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
        setTimeout(() => { window.location.href = url; }, 420);
      });
    });
  });
})();
</script>

</body>
</html>
